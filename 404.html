<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Esta página no existe · FlexGo Group</title>
<style>
:root{color-scheme:light dark;--fondo:#F4F7FB;--tinta:#07152E;--suave:#4A5568;--acento:#0B7FA8;--sobre:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--fondo:#07152E;--tinta:#F2F4F7;--suave:#AEB6C2}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--fondo);color:var(--tinta);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
main{max-width:30rem}
.marca{font-weight:700;letter-spacing:.02em;margin:0 0 2.2rem}
.num{font-size:.9rem;font-weight:600;color:var(--acento);margin:0 0 .4rem}
h1{font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.2;margin:0 0 .7rem}
p{color:var(--suave);margin:0 0 1.6rem}
.marca,.num{color:var(--tinta)}
.num{color:var(--acento)}
a.btn{display:inline-block;min-height:44px;padding:.65rem 1.4rem;border-radius:999px;background:var(--acento);color:var(--sobre);font-weight:600;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.ayuda{font-size:.9rem;margin:1.6rem 0 0}
.ayuda a{color:inherit}
</style>
</head>
<body>
<main>
<p class="marca">FlexGo Group</p>
<p class="num">Error 404</p>
<h1>Esta página no existe</h1>
<p>Puede que el enlace haya cambiado o esté mal escrito.</p>
<a class="btn" href="/">Ir a la consola</a>
</main>
</body>
</html>
